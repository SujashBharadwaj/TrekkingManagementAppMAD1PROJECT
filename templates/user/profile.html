{% extends 'base.html' %}

{% block title %}My Profile - M&M{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="mb-3">
            <a href="{{ url_for('trekker.user_dashboard') }}" class="btn btn-outline-secondary btn-sm">&larr; Back to Dashboard</a>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Edit Profile Details</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('trekker.profile') }}" method="POST">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control bg-light" id="username" value="{{ user.username }}" readonly disabled>
                        <small class="text-muted">Username cannot be changed.</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    
                    <hr class="my-4">
                    <h5 class="mb-3">Change Password</h5>
                    <p class="text-muted small">Leave blank if you do not wish to update your password.</p>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('trekker.user_dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
